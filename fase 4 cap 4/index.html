<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <script>
        var notas = [10, 8, 9, 7, 6];
        var index = 0
        var somaNotas = 0

        do{
            console.log('A nota do${index+1} bimestre é: ${notas[index]}')
            somaNotas += notas[index]
            index++

        }while(index < notas.length)

        console.log('A média do aluno é: ${somaNotas/notas.length} boom')
        

    </script>
    
</body>
</html>
