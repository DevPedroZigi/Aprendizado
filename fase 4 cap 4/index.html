<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- CSS EXTERNO -->
     <link rel="stylesheet" href="./src/css/estilo.css">
     <!-- CSS BOOTSTRAP -->
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <title>Bolão Copa 2026</title>
</head>
<body>
 
    <header class="navbar bg-warning shadow-sm mb-5">
        <div class="container">
            <h1 class="navbar-brand fw-bold mb-0">BETEDSON COPA<span class="text-success p-2">2026</span></h1>
        </div>
    </header>
    <main class="container">
 
        <h2 class="text-center mb-4">Partidas Disponíveis</h2>
 
        <section class="row g-4">
            <div class="col-md-6 col-lg-4">
            <div class="card h-100 rounded-4 shadow-sm border-0">
                <div class="card-body p-4">  
                    <h5 class="card-title fw-bold">Brasil vs Haiti</h5>
                    <p class="text-muted small">20/06 - 21:30</p>                
                <div class="input-group mb-3">
                    <input type="number" class="form-control" placeholder="Brasil" id="time1-1">
                    <input type="number" class="form-control"  placeholder="Haiti"  id="time2-1">
                </div>
                <button class="btn btn-primary w-100 rounded-pill" onclick="salvarPalpite('Brasil vs Haiti',1)">Palpite</button>
                </div>
            </div>
            </div>  
              <div class="col-md-6 col-lg-4">
            <div class="card h-100 rounded-4 shadow-sm border-0">
                <div class="card-body p-4">  
                    <h5 class="card-title fw-bold">Argentina vs Argélia</h5>
                    <p class="text-muted small">16/06 - 21:30</p>                
                <div class="input-group mb-3">
                    <input type="number" class="form-control" placeholder="Argentina" id="time1-2">
                    <input type="number" class="form-control" placeholder="Argélia"  id="time2-2">
                </div>
                <button class="btn btn-primary w-100 rounded-pill" onclick="salvarPalpite('Argentina vs Argélia',2)">Palpite</button>
                </div>
            </div>
            </div>  
        </section>
 
        <section class="mt-5 p-4 bg-white rounded-4 shadow-sm">
            <h3 class="mb-3">Histórico de Palpites</h3>
            <ul id="lista-resultados" class="list-group list-group-flush"></ul>
        </section>
 
    </main>
    <footer class="text-center py-5 text-muted small">
        &copy;2026 - Copa 2026
    </footer>
 
    <!-- JS EXTERNO -->
     <script src="./src/js/script.js"></script>
 
     <!-- JS BOOTSRAP -->
    <!-- <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script> -->
</body>
</html>
